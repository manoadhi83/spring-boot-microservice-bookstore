spring:
  application:
    name: order-service
################ Datasource Configuration ####################
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/bookstore}
    username: ${MYSQL_USER:appuser}
    password: ${MYSQL_PASSWORD:apppass}
################ RabbitMQ Configuration ####################
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8082

################ Order-Service Configuration ################
orders:
  catalog-service-url: http://localhost:8081
  order-events-exchange: orders-exchange
  new-orders-queue:  new-orders
  delivered-orders-queue: delivered-orders
  cancelled-orders-queue: cancelled-orders
  error-orders-queue: error-orders


  ############### Resilience4J Configuration ##################
  ## Resilience4j Configuration
  resilience4j:
    retry:
      backends:
        catalog-service:
          max-attempts: 2
          wait-duration: 1s
    circuitbreaker:
      backends:
        catalog-service:
          sliding-window-type: COUNT_BASED
          sliding-window-size: 6
          minimum-number-of-calls: 4
          wait-duration-in-open-state: 20s
          permitted-number-of-calls-in-half-open-state: 2
          failure-rate-threshold: 50

