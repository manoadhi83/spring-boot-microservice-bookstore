server:
  port: 8989
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: catalog-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/products/**
            - id: orders-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/orders/**
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
