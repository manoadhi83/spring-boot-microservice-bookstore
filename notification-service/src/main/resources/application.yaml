spring:
  application:
    name: notification-service
  ################ Datasource Configuration ####################
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/bookstore}
    username: ${MYSQL_USER:appuser}
    password: ${MYSQL_PASSWORD:apppass}
  ################ RabbitMQ Configuration ####################
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  ############# Mail Properties ###########
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:PLACEHOLDER}
    password: ${MAIL_PASSWORD:PLACEHOLDER}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
server:
  port: 8083
  shutdown: GRACEFUL

######## Notification Service Configuration  #########
notification:
  order-events-exchange: orders-exchange
  new-orders-queue: new-orders
  delivered-orders-queue: delivered-orders
  cancelled-orders-queue: cancelled-orders
  error-orders-queue: error-orders
  support-email: manoa@gmail.com

