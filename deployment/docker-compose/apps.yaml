name: 'springboot-microservices-bookstore'
services:
  catalog-service:
    image: manoadhi/bs-catalog-service
    container_name: catalog-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:mysql://catalog-db:3306/bookstore
      - DB_USERNAME=appuser
      - DB_PASSWORD=apppass
    ports:
      - "8081:8081"
    restart: unless-stopped
    depends_on:
      catalog-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 700m

  order-service:
    image: manoadhi/bs-order-service
    container_name: order-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - ORDERS_CATALOG_SERVICE_URL=http://catalog-service:8081
      - DB_URL=jdbc:mysql://order-db:3306/bookstore
      - DB_USERNAME=appuser
      - DB_PASSWORD=apppass
      - RABBITMQ_HOST=bs-rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
    ports:
      - "8082:8082"
    restart: no
    depends_on:
      order-db:
        condition: service_healthy
      bs-rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 700m

